name: Auto Release

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.v'
      - '**/*.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: fastgit
  EXTRA_FLAGS: ""

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            setup_cmd: sudo apt-get update && sudo apt-get install -y musl-tools
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -cc musl-gcc -cflags "-static" -o $APP_NAME$SUFFIX .
            artifact_suffix: -linux-amd64

          - target: linux-arm64
            runner: ubuntu-latest
            setup_cmd: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -os linux -cc aarch64-linux-gnu-gcc -cflags "-static" -o $APP_NAME$SUFFIX .
            artifact_suffix: -linux-arm64

          - target: android-arm64
            runner: ubuntu-latest
            setup_cmd: ""
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -os linux -cc "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" -cflags "-fPIE -pie -U__ANDROID__" -o $APP_NAME$SUFFIX .
            artifact_suffix: -android-arm64

          - target: android-arm
            runner: ubuntu-latest
            setup_cmd: ""
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -os linux -cc "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" -cflags "-fPIE -pie -U__ANDROID__" -o $APP_NAME$SUFFIX .
            artifact_suffix: -android-arm

          - target: windows-amd64
            runner: ubuntu-latest
            setup_cmd: sudo apt-get update && sudo apt-get install -y mingw-w64
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -os windows -cc x86_64-w64-mingw32-gcc -cflags "-static -municode" -o $APP_NAME$SUFFIX .
            artifact_suffix: -windows-amd64.exe

          - target: windows-386
            runner: ubuntu-latest
            setup_cmd: sudo apt-get update && sudo apt-get install -y mingw-w64
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -os windows -cc i686-w64-mingw32-gcc -cflags "-static -municode" -o $APP_NAME$SUFFIX .
            artifact_suffix: -windows-386.exe

          - target: macos-amd64
            runner: macos-latest
            setup_cmd: ""
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -cflags "-arch x86_64" -o $APP_NAME$SUFFIX .
            artifact_suffix: -macos-amd64

          - target: macos-arm64
            runner: macos-latest
            setup_cmd: ""
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -cflags "-arch arm64" -o $APP_NAME$SUFFIX .
            artifact_suffix: -macos-arm64

          - target: freebsd-amd64
            runner: ubuntu-latest
            setup_cmd: |
              sudo apt-get update && sudo apt-get install -y clang lld
              mkdir -p freebsd-sysroot
              curl -LSs https://download.freebsd.org/releases/amd64/amd64/14.4-RELEASE/base.txz | tar -xJ -C freebsd-sysroot ./usr/include ./usr/lib ./lib
            build_cmd: |
              v $EXTRA_FLAGS -d no_backtrace -enable-globals -autofree -os freebsd -cc clang -cflags "-static -target x86_64-unknown-freebsd14.4 --sysroot=freebsd-sysroot -fuse-ld=lld -lm -lpthread" -o $APP_NAME$SUFFIX .
            artifact_suffix: -freebsd-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Setup Compiler Dependencies
        if: matrix.setup_cmd != ''
        run: ${{ matrix.setup_cmd }}

      - name: Build binary
        run: ${{ matrix.build_cmd }}
        env:
          SUFFIX: ${{ matrix.artifact_suffix }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}${{ matrix.artifact_suffix }}
          path: ${{ env.APP_NAME }}${{ matrix.artifact_suffix }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Delete older releases and git tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Phase 1: Pruning older releases ==="
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "latest" ] && [ -n "$tag" ]; then
              echo "Deleting release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          echo "=== Phase 2: Pruning orphaned git tags (All Pages) ==="
          gh api --paginate "repos/${{ github.repository }}/tags" --jq '.[].name' | while read -r tag; do
            if [ "$tag" != "latest" ] && [ -n "$tag" ]; then
              echo "Pruning remote git tag ref: $tag"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
            fi
          done

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Build ${{ github.run_number }}
          artifacts: ./artifacts/*
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
